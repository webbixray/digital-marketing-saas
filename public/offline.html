<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — DigitalMarketingSaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/build/assets/unified-CDwaONvk.css">
</head>
<body class="bg-gray-50 text-gray-900 antialiased" style="font-family: 'Inter', sans-serif;">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="w-20 h-20 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-wifi-slash text-indigo-600 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-4">You're Offline</h1>
            <p class="text-gray-600 mb-8">Check your connection and try again. Some features may be limited while offline.</p>
            <button onclick="window.location.reload()" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 inline-flex items-center gap-2">
                <i class="fas fa-refresh"></i> Try Again
            </button>
        </div>
    </div>
</body>
</html>
