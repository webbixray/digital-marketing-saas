version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalmarketingsaas/app
    container_name: dmsaas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dmsaas-network

  webserver:
    image: nginx:alpine
    container_name: dmsaas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - dmsaas-network

  db:
    image: mysql:8.0
    container_name: dmsaas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digitalmarketingsaas
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: dmsaas
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - dmsaas-network

  redis:
    image: redis:alpine
    container_name: dmsaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dmsaas-network

  queue:
    image: digitalmarketingsaas/app
    container_name: dmsaas-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    networks:
      - dmsaas-network
    depends_on:
      - db
      - redis

  scheduler:
    image: digitalmarketingsaas/app
    container_name: dmsaas-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    networks:
      - dmsaas-network
    depends_on:
      - db
      - redis

networks:
  dmsaas-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
