name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, mysql, redis, gd, curl, zip
    
    - name: Install Dependencies
      run: composer install --no-interaction --prefer-dev --optimize-autoloader
    
    - name: Generate key
      run: php artisan key:generate
    
    - name: Run migrations
      run: php artisan migrate --force
    
    - name: Optimize
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
    
    - name: Deploy
      run: echo "Deploy to production server"
      # Uncomment and configure for your deployment:
      # ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && git pull && composer install --no-dev && php artisan migrate --force && php artisan optimize"
