# Zero-build staging - uses official images only
# No custom Dockerfile needed; all config via environment variables

version: '3.8'

services:
  app:
    image: php:8.4-fpm-alpine
    container_name: dmsaas-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - DB_HOST=db
      - REDIS_HOST=redis
      - DB_DATABASE=digitalmarketingsaas
      - DB_USERNAME=dmsaas
      - DB_PASSWORD=dmspassword
      - DB_CONNECTION=mysql
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - dmsaas-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: dmsaas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dmsaas-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: dmsaas-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digitalmarketingsaas
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: dmspassword
      MYSQL_USER: dmsaas
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - dmsaas-network

  redis:
    image: redis:7-alpine
    container_name: dmsaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - dmsaas-network

  queue:
    image: php:8.4-fpm-alpine
    container_name: dmsaas-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=staging
      - DB_HOST=db
      - DB_DATABASE=digitalmarketingsaas
      - DB_USERNAME=dmsaas
      - DB_PASSWORD=dmspassword
      - DB_CONNECTION=mysql
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - dmsaas-network
    depends_on:
      - db
      - redis

  scheduler:
    image: php:8.4-fpm-alpine
    container_name: dmsaas-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=staging
      - DB_HOST=db
      - DB_DATABASE=digitalmarketingsaas
      - DB_USERNAME=dmsaas
      - DB_PASSWORD=dmspassword
      - DB_CONNECTION=mysql
      - SESSION_DRIVER=file
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
    networks:
      - dmsaas-network
    depends_on:
      - db
      - redis

networks:
  dmsaas-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
